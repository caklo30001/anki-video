<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Reproductor Anki</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #player, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  p { color: #ccc; font: 16px sans-serif; text-align: center; padding: 2em 1em; margin: 0; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  // Uso: index.html?v=ID_DEL_VIDEO&start=SEGUNDOS&end=SEGUNDOS
  // La página corta el fragmento ella misma: al llegar a "end" pausa y vuelve a "start".
  var q = new URLSearchParams(location.search);
  var v = (q.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "");
  var start = parseFloat(q.get("start"));
  var end = parseFloat(q.get("end"));
  if (isNaN(start)) start = 0;
  if (isNaN(end) || end <= start) end = null;
  var player, timer;

  function backToStart() {
    player.pauseVideo();
    player.seekTo(start, true);
    player.pauseVideo();
  }

  function watch() {
    clearInterval(timer);
    timer = setInterval(function () {
      var t = player.getCurrentTime();
      if (end !== null && t >= end) { clearInterval(timer); backToStart(); }
    }, 100);
  }

  function onStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      var t = player.getCurrentTime();
      // Si arranca fuera del fragmento (por ejemplo desde 0), lo encuadra
      if (t < start - 0.5 || (end !== null && t >= end)) player.seekTo(start, true);
      watch();
    } else if (e.data === YT.PlayerState.ENDED) {
      clearInterval(timer);
      backToStart();
    } else {
      clearInterval(timer);
    }
  }

  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      videoId: v,
      // Sin "end": así YouTube nunca da el video por terminado y no lo reinicia a 0
      playerVars: { start: Math.floor(start), rel: 0, playsinline: 1, origin: location.origin },
      events: { onStateChange: onStateChange }
    });
  }

  if (!v) {
    document.getElementById("player").innerHTML = "<p>Falta el ID del video (?v=...)</p>";
  } else {
    var s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }
</script>
</body>
</html>
