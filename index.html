<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Reproductor Anki</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd;
    font: 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #vid { position: relative; flex: 1 1 auto; min-height: 120px; }
  #player, #vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #bar { flex: 0 0 auto; background: #141414; padding: 4px 6px; display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 6px;
    padding: 4px 8px; font: inherit; cursor: pointer; min-width: 34px; }
  button:hover { background: #363636; }
  button:focus-visible { outline: 2px solid #6aa0ff; outline-offset: 1px; }
  button.on { background: #3b5ba5; border-color: #4d6fc0; }
  .lbl { color: #999; margin-left: 6px; }
  output { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; color: #fff; }
  #copyTxt { width: 190px; max-width: 100%; background: #0d0d0d; color: #cfe; border: 1px solid #333;
    border-radius: 6px; padding: 4px 6px; font: 12px ui-monospace, Consolas, monospace; }
  #msg { color: #8fd18f; min-height: 1em; text-align: center; font-size: 12px; }
  p.err { color: #ccc; font-size: 16px; text-align: center; padding: 2em 1em; margin: 0; }
  #cover { position: absolute; inset: 0; background: #000; z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; color: #fff; text-align: center; }
  #cover b { font-size: 48px; font-variant-numeric: tabular-nums; line-height: 1; }
  #cover span { font-size: 14px; color: #bbb; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="vid"><div id="player"></div>
    <div id="cover" hidden><span>🔇 Silenciado mientras pasan los anuncios</span><b id="coverN">10</b>
      <button type="button" id="coverX">Mostrar ahora</button></div>
  </div>
  <div id="bar">
    <div class="row">
      <button id="rep" title="Repetir fragmento (R)">⟲ Repetir</button>
      <button id="back" title="Atrás 1 segundo (←)">−1 s</button>
      <button id="play" title="Reproducir / pausa">▶︎ / ❚❚</button>
      <button id="fwd" title="Adelante 1 segundo (→)">+1 s</button>
      <button id="slow" title="Velocidad lenta (S)">0.5×</button>
      <button id="loop" title="Repetir en bucle (B)">∞ Bucle</button>
      <button id="mute" title="Silenciar 10 s y tapar los anuncios (M)">🔊 Sonido</button>
      <button id="toggleAdj" title="Corregir inicio y fin">Ajustar</button>
    </div>
    <div class="row" id="adj" hidden>
      <span class="lbl">Inicio</span>
      <button data-a="s-" title="Inicio −0.5 s">−</button><output id="sOut"></output><button data-a="s+" title="Inicio +0.5 s">+</button>
      <button id="markS" title="Usar el momento actual como inicio">Aquí</button>
      <span class="lbl">Fin</span>
      <button data-a="e-" title="Fin −0.5 s">−</button><output id="eOut"></output><button data-a="e+" title="Fin +0.5 s">+</button>
      <button id="markE" title="Usar el momento actual como fin">Aquí</button>
      <button id="reset" title="Volver a los tiempos originales">Original</button>
    </div>
    <div class="row" id="adj2" hidden>
      <input id="copyTxt" readonly aria-label="Tiempos corregidos">
      <button id="copy">Copiar</button>
    </div>
    <div id="msg" aria-live="polite"></div>
  </div>
</div>
<script>
  // Uso: index.html?v=ID&start=SEG&end=SEG&autoplay=1 (bucle activado por defecto; &loop=0 lo apaga)
  var q = new URLSearchParams(location.search);
  var v = (q.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "");
  var origStart = parseFloat(q.get("start")); if (isNaN(origStart)) origStart = 0;
  var origEnd = parseFloat(q.get("end")); if (isNaN(origEnd) || origEnd <= origStart) origEnd = null;
  var start = origStart, end = origEnd;
  var player, timer, armed = true, rate = 1, loop = q.get("loop") !== "0", pauseT;
  var $ = function (id) { return document.getElementById(id); };

  // ---- Ajustes guardados en este dispositivo ----
  var KEY = "clip:" + v + ":" + origStart + ":" + (origEnd === null ? "" : origEnd);
  function load() {
    try { var o = JSON.parse(localStorage.getItem(KEY) || "null");
      if (o) { start = o.s; end = o.e; } } catch (e) {}
    try { var r = parseFloat(localStorage.getItem("rate")); if (r === 0.5) rate = r; } catch (e) {}
    try { var l = localStorage.getItem("loop"); if (l !== null && q.get("loop") === null) loop = l === "1"; } catch (e) {}
  }
  function save() {
    try {
      if (start === origStart && end === origEnd) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, JSON.stringify({ s: start, e: end }));
    } catch (e) {}
  }

  function r1(x) { return Math.round(x * 10) / 10; }
  function fmt(x) {
    if (x === null) return "—";
    var m = Math.floor(x / 60), s = x - m * 60;
    return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
  }
  function msg(t) { $("msg").textContent = t; clearTimeout(msg.t); msg.t = setTimeout(function () { $("msg").textContent = ""; }, 2500); }
  function show() {
    $("sOut").textContent = fmt(start);
    $("eOut").textContent = fmt(end);
    $("copyTxt").value = "startSeconds " + r1(start) + "  endSeconds " + (end === null ? "" : r1(end));
    $("slow").classList.toggle("on", rate !== 1);
    $("loop").classList.toggle("on", loop);
  }

  // ---- Reproductor ----
  function ok() { return player && typeof player.getCurrentTime === "function"; }
  function now() { return ok() ? player.getCurrentTime() : start; }

  function backToStart() {
    clearTimeout(pauseT);
    if (loop) {
      // Bucle: vuelve al inicio, pausa breve y sigue reproduciendo
      player.pauseVideo(); player.seekTo(start, true);
      pauseT = setTimeout(function () { if (loop) { armed = false; player.playVideo(); } }, 700);
      return;
    }
    player.pauseVideo(); player.seekTo(start, true); player.pauseVideo(); armed = true;
  }
  function watch() {
    clearInterval(timer);
    timer = setInterval(function () {
      if (end !== null && now() >= end) { clearInterval(timer); backToStart(); }
    }, 100);
  }
  function onStateChange(e) {
    if (e.data === YT.PlayerState.PLAYING) {
      var t = now();
      if (armed && (t < start - 0.5 || (end !== null && t >= end))) player.seekTo(start, true);
      armed = false;
      watch();
    } else if (e.data === YT.PlayerState.ENDED) {
      clearInterval(timer); backToStart();
    } else {
      clearInterval(timer);
    }
  }
  function onReady() {
    if (rate !== 1) player.setPlaybackRate(rate);
    if (Math.abs(start - origStart) > 0.05) player.seekTo(start, true);
  }
  function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
      // Modo de privacidad de YouTube; cambia NOCOOKIE a false para volver al normal
      host: NOCOOKIE ? "https://www.youtube-nocookie.com" : "https://www.youtube.com",
      videoId: v,
      playerVars: { start: Math.floor(start), rel: 0, playsinline: 1, origin: location.origin,
                    autoplay: q.get("autoplay") === "1" ? 1 : 0 },
      events: { onReady: onReady, onStateChange: onStateChange }
    });
  }

  // ---- Controles ----
  function repeat() { if (!ok()) return; clearTimeout(pauseT); armed = false; player.seekTo(start, true); player.playVideo(); }
  function jump(d) {
    if (!ok()) return;
    var t = Math.max(0, now() + d);
    if (end !== null && t >= end) t = Math.max(start, end - 0.2);
    armed = false; player.seekTo(t, true);
  }
  function togglePlay() {
    if (!ok()) return;
    if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
    else { var t = now(); if (end !== null && t >= end) player.seekTo(start, true); armed = false; player.playVideo(); }
  }
  // Silencio + pantalla negra con cuenta regresiva; al terminar vuelve el sonido
  var COVER_SECS = 13, coverT = null;
  var NOCOOKIE = q.get("nocookie") !== "0";
  function toggleMute() {
    if (!ok()) return;
    if (player.isMuted()) { endCover(); return; }
    player.mute();
    var left = COVER_SECS;
    $("coverN").textContent = left;
    $("cover").hidden = false;
    clearInterval(coverT);
    coverT = setInterval(function () {
      left--;
      $("coverN").textContent = left;
      if (left <= 0) endCover();
    }, 1000);
    setTimeout(showMute, 150);
  }
  function endCover() {
    clearInterval(coverT);
    $("cover").hidden = true;
    if (ok()) player.unMute();
    setTimeout(showMute, 150);
  }
  function showMute() {
    var m = ok() && player.isMuted();
    $("mute").textContent = m ? "🔇 Silenciado" : "🔊 Sonido";
    $("mute").classList.toggle("on", m);
  }
  function toggleLoop() {
    loop = !loop;
    if (!loop) clearTimeout(pauseT);
    try { localStorage.setItem("loop", loop ? "1" : "0"); } catch (e) {}
    msg(loop ? "Bucle activado" : "Bucle desactivado");
    show();
  }
  function toggleSlow() {
    rate = rate === 1 ? 0.5 : 1;
    if (ok()) player.setPlaybackRate(rate);
    try { localStorage.setItem("rate", String(rate)); } catch (e) {}
    show();
  }
  function setStart(x) {
    x = r1(Math.max(0, x));
    if (end !== null && x >= end - 0.3) { msg("El inicio debe ir antes del fin"); return; }
    start = x; save(); show();
  }
  function setEnd(x) {
    x = r1(x);
    if (x <= start + 0.3) { msg("El fin debe ir después del inicio"); return; }
    end = x; save(); show();
  }

  $("rep").onclick = repeat;
  $("back").onclick = function () { jump(-1); };
  $("fwd").onclick = function () { jump(1); };
  $("play").onclick = togglePlay;
  $("slow").onclick = toggleSlow;
  $("loop").onclick = toggleLoop;
  $("mute").onclick = toggleMute;
  $("coverX").onclick = endCover;
  $("toggleAdj").onclick = function () {
    var h = !$("adj").hidden;
    $("adj").hidden = h; $("adj2").hidden = h;
    $("toggleAdj").classList.toggle("on", !h);
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-a]"), function (b) {
    b.onclick = function () {
      var a = b.getAttribute("data-a");
      if (a === "s-") setStart(start - 0.5);
      if (a === "s+") setStart(start + 0.5);
      if (a === "e-") setEnd((end === null ? now() : end) - 0.5);
      if (a === "e+") setEnd((end === null ? now() : end) + 0.5);
    };
  });
  $("markS").onclick = function () { setStart(now()); };
  $("markE").onclick = function () { setEnd(now()); };
  $("reset").onclick = function () { start = origStart; end = origEnd; save(); show(); msg("Tiempos originales"); };
  $("copy").onclick = function () {
    var t = $("copyTxt");
    var done = function () { msg("Copiado"); };
    var fallback = function () { t.focus(); t.select(); try { document.execCommand("copy"); done(); } catch (e) { msg("Selecciona el texto y cópialo"); } };
    try { navigator.clipboard.writeText(t.value).then(done, fallback); } catch (e) { fallback(); }
  };
  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft") { jump(-1); e.preventDefault(); }
    else if (e.key === "ArrowRight") { jump(1); e.preventDefault(); }
    else if (e.key === "r" || e.key === "R") repeat();
    else if (e.key === "s" || e.key === "S") toggleSlow();
    else if (e.key === "b" || e.key === "B") toggleLoop();
    else if (e.key === "m" || e.key === "M") toggleMute();
  });

  load(); show();
  if (!v) {
    $("wrap").innerHTML = '<p class="err">Falta el ID del video (?v=...)</p>';
  } else {
    var s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }
</script>
</body>
</html>
