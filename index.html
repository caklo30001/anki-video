<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Reproductor Anki</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #player, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  p { color: #ccc; font: 16px sans-serif; text-align: center; padding: 2em 1em; margin: 0; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  // Uso: index.html?v=ID_DEL_VIDEO&start=SEGUNDOS&end=SEGUNDOS
  var q = new URLSearchParams(location.search);
  var v = (q.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "");
  var start = parseInt(q.get("start"), 10);
  var end = parseInt(q.get("end"), 10);
  if (isNaN(start)) start = 0;
  if (isNaN(end)) end = undefined;
  var player, timer;

  function clip() {
    var c = { videoId: v, startSeconds: start };
    if (end !== undefined) c.endSeconds = end;
    return c;
  }

  // Deja el video listo otra vez al inicio del fragmento
  function reset() {
    clearInterval(timer);
    player.cueVideoById(clip());
  }

  function onStateChange(e) {
    if (e.data === YT.PlayerState.ENDED) {
      reset();
    } else if (e.data === YT.PlayerState.PLAYING) {
      // Si alguien adelanta fuera del rango, lo vuelve a encuadrar
      var t = player.getCurrentTime();
      if (t < start - 1) player.seekTo(start, true);
      clearInterval(timer);
      if (end !== undefined) {
        timer = setInterval(function () {
          if (player.getCurrentTime() >= end) { player.pauseVideo(); reset(); }
        }, 200);
      }
    } else {
      clearInterval(timer);
    }
  }

  function onYouTubeIframeAPIReady() {
    var vars = { start: start, rel: 0, playsinline: 1, origin: location.origin };
    if (end !== undefined) vars.end = end;
    player = new YT.Player("player", {
      videoId: v,
      playerVars: vars,
      events: { onStateChange: onStateChange }
    });
  }

  if (!v) {
    document.getElementById("player").innerHTML = "<p>Falta el ID del video (?v=...)</p>";
  } else {
    var s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }
</script>
</body>
</html>
